[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minieval-local"
version = "0.3.0"
description = "A simple dataset-based LLM evaluation library using Ollama as a local judge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
  "pydantic>=2.6,<3",
  "pandas>=2.1,<4",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32,<2"]
test = ["pytest>=8,<9"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["minieval*"]

[tool.setuptools.package-data]
minieval = ["data/*.csv"]
